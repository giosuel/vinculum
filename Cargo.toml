[workspace]
resolver = "3"
members = ["crates/app", "crates/nm", "xtask"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["giosuel <me@giosuel.ch>"]
repository = "https://github.com/giosuel/vinculum"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.18.1"
slint-build = "1.18.1"

[workspace.lints.rust]
# deny, not forbid: Slint's generated code allows it locally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
