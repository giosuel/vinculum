[workspace]
resolver = "3"
members = ["crates/app", "crates/cli", "crates/keyring", "crates/nm", "xtask"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["giosuel <me@giosuel.ch>"]
repository = "https://github.com/giosuel/vinculum"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
qrcodegen = "1.8.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
serde_json = "1.0.151"
slint = "1.18.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = "1.0.229"
thiserror = "2.0.21"
tokio = "1.53.2"
vinculum-keyring = { path = "crates/keyring" }
vinculum-nm = { path = "crates/nm" }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
slint-build = "1.18.1"
toml = "1.1.6"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
# The same runtime as Slint's own tray (async-io): ksni can't have both.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
resvg = { version = "0.48.1", default-features = false }

[workspace.lints.rust]
# deny, not forbid: Slint's generated code allows it locally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
