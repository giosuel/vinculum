site_name: Vinculum
site_description: A network manager for Hyprland, Sway and other desktops without one. Wi-Fi, wired and WireGuard, on NetworkManager. Written in Rust.
site_url: https://vinculum.giosuel.ch/
repo_url: https://github.com/giosuel/vinculum
repo_name: giosuel/vinculum
edit_uri: edit/main/docs/
copyright: Vinculum is free software under the AGPL-3.0-or-later.

exclude_docs: |
  requirements.txt

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/giosuel/vinculum
      name: Vinculum on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installing: installing.md
  - Hyprland: hyprland.md
  - Development: development.md
