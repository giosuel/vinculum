[package]
name = "lituus"
description = "Manage Wi-Fi, wired and VPN connections on Linux desktops"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
qrcodegen.workspace = true
pulseaudio.workspace = true
x25519-dalek.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
slint.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
zbus.workspace = true
toml.workspace = true
toml_edit.workspace = true
ksni.workspace = true
resvg.workspace = true
lituus-bt.workspace = true
lituus-hypr.workspace = true
lituus-keyring.workspace = true
lituus-nm.workspace = true
lituus-sound.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
# Slint's own test backend (a mock window and clock), the same version as slint.
i-slint-backend-testing = "=1.18.1"

[lints]
workspace = true

# `cargo deb` (Debian, Ubuntu). target/release is mapped to the real target directory.
[package.metadata.deb]
name = "lituus"
maintainer = "giosuel <me@giosuel.ch>"
section = "net"
priority = "optional"
extended-description = """\
A network manager for Linux desktops that don't come with one, such as Hyprland and Sway. \
It drives NetworkManager: connect to Wi-Fi, wired and WireGuard networks, and edit every \
connection setting."""
# $auto adds the libraries the binary links against; xkbcommon and EGL are loaded at runtime.
depends = "$auto, network-manager, libxkbcommon0, libegl1"
# Optional: OpenVPN, file dialogs (certificates, VPN files), and a keyring for "for me only".
recommends = "xdg-desktop-portal, gnome-keyring | kwalletmanager, bluez, pipewire-pulse | pulseaudio"
suggests = "network-manager-openvpn"
assets = [
    ["target/release/lituus", "usr/bin/", "755"],
    ["../../packaging/linux/ch.giosuel.Lituus.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/ch.giosuel.Lituus.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/icons/ch.giosuel.Lituus.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/lituus/", "644"],
    # The fonts built into the binary (SIL Open Font License).
    ["ui/fonts/Inter-LICENSE.txt", "usr/share/doc/lituus/fonts/", "644"],
    ["ui/fonts/JetBrainsMono-LICENSE.txt", "usr/share/doc/lituus/fonts/", "644"],
]

# `cargo generate-rpm` (Fedora, openSUSE). Library requirements by soname, so the same package
# works across distributions whose package names differ.
[package.metadata.generate-rpm]
name = "lituus"
summary = "Manage Wi-Fi, wired and VPN connections"
assets = [
    { source = "target/release/lituus", dest = "/usr/bin/lituus", mode = "755" },
    { source = "../../packaging/linux/ch.giosuel.Lituus.desktop", dest = "/usr/share/applications/ch.giosuel.Lituus.desktop", mode = "644" },
    { source = "../../packaging/linux/ch.giosuel.Lituus.metainfo.xml", dest = "/usr/share/metainfo/ch.giosuel.Lituus.metainfo.xml", mode = "644" },
    { source = "../../packaging/linux/icons/ch.giosuel.Lituus.svg", dest = "/usr/share/icons/hicolor/scalable/apps/ch.giosuel.Lituus.svg", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/lituus/README.md", mode = "644", doc = true },
    { source = "ui/fonts/Inter-LICENSE.txt", dest = "/usr/share/licenses/lituus/Inter-LICENSE.txt", mode = "644", doc = true },
    { source = "ui/fonts/JetBrainsMono-LICENSE.txt", dest = "/usr/share/licenses/lituus/JetBrainsMono-LICENSE.txt", mode = "644", doc = true },
]

# The release workflow sets `requires` from the binary (packaging/linux/rpm-requires.sh).
auto-req = "no"
