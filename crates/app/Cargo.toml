[package]
name = "vinculum"
description = "Manage Wi-Fi, wired and VPN connections on Linux desktops"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
clap.workspace = true
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

# `cargo deb` (Debian, Ubuntu). target/release is mapped to the real target directory.
[package.metadata.deb]
name = "vinculum"
maintainer = "giosuel <me@giosuel.ch>"
section = "net"
priority = "optional"
extended-description = """\
A network manager for Linux desktops that don't come with one, such as Hyprland and Sway. \
It drives NetworkManager: connect to Wi-Fi, wired and WireGuard networks, and edit every \
connection setting."""
# $auto adds the libraries the binary links against; xkbcommon and EGL are loaded at runtime.
depends = "$auto, network-manager, libxkbcommon0, libegl1"
assets = [
    ["target/release/vinculum", "usr/bin/", "755"],
    ["../../packaging/linux/ch.giosuel.Vinculum.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/ch.giosuel.Vinculum.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/icons/ch.giosuel.Vinculum.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/vinculum/", "644"],
]

# `cargo generate-rpm` (Fedora, openSUSE). Library requirements by soname, so the same package
# works across distributions whose package names differ.
[package.metadata.generate-rpm]
name = "vinculum"
summary = "Manage Wi-Fi, wired and VPN connections"
assets = [
    { source = "target/release/vinculum", dest = "/usr/bin/vinculum", mode = "755" },
    { source = "../../packaging/linux/ch.giosuel.Vinculum.desktop", dest = "/usr/share/applications/ch.giosuel.Vinculum.desktop", mode = "644" },
    { source = "../../packaging/linux/ch.giosuel.Vinculum.metainfo.xml", dest = "/usr/share/metainfo/ch.giosuel.Vinculum.metainfo.xml", mode = "644" },
    { source = "../../packaging/linux/icons/ch.giosuel.Vinculum.svg", dest = "/usr/share/icons/hicolor/scalable/apps/ch.giosuel.Vinculum.svg", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/vinculum/README.md", mode = "644", doc = true },
]

# The release workflow sets `requires` from the binary (packaging/linux/rpm-requires.sh).
auto-req = "no"
