# Vinculum – Hyprland integration (hyprland.conf)
# Paste into ~/.config/hypr/hyprland.conf (or `source = /path/to/this/file`).
# Hyprland 0.55+ prefers a Lua config and will drop this syntax: see hyprland.lua.

# --- Window rules: Hyprland 0.53 and newer -------------------------------
# The window floats in the middle at the size it's designed for, instead of tiling.
windowrule = match:class ^(ch\.giosuel\.Vinculum)$, float on
windowrule = match:class ^(ch\.giosuel\.Vinculum)$, size 1040 680
windowrule = match:class ^(ch\.giosuel\.Vinculum)$, center on

# --- Window rules: Hyprland 0.48 – 0.52 (use INSTEAD of the block above) --
# windowrule = float, class:^(ch\.giosuel\.Vinculum)$
# windowrule = size 1040 680, class:^(ch\.giosuel\.Vinculum)$
# windowrule = center, class:^(ch\.giosuel\.Vinculum)$
# (Hyprland < 0.48: same lines, but `windowrulev2` instead of `windowrule`.)

# --- Start in the background ------------------------------------------------
# So NetworkManager can ask for the passwords kept in your keyring when it connects at login.
exec-once = vinculum --background

# --- Keybinds ----------------------------------------------------------------
bind = SUPER, N, exec, vinculum        # open the window
