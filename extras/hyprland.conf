# Vinculum – Hyprland integration (hyprland.conf)
# Paste into ~/.config/hypr/hyprland.conf (or `source = /path/to/this/file`).
# Hyprland 0.55+ prefers a Lua config and will drop this syntax: see hyprland.lua.

# --- Window rules: Hyprland 0.53 and newer -------------------------------
# The window floats in the middle at the size it's designed for, instead of tiling.
windowrule = float on, match:class ^(ch\.giosuel\.Vinculum)$, match:title ^(Vinculum)$
windowrule = size 1040 680, match:class ^(ch\.giosuel\.Vinculum)$, match:title ^(Vinculum)$
windowrule = center on, match:class ^(ch\.giosuel\.Vinculum)$, match:title ^(Vinculum)$
# The quick popup (tray icon left-click, `vinculum --quick`): top right, under the bar. To open it at
# the pointer instead: move (cursor_x-(window_w*0.5)) (cursor_y+12)
windowrule = float on, match:class ^(ch\.giosuel\.Vinculum)$, match:title ^(Vinculum quick)$
windowrule = pin on, match:class ^(ch\.giosuel\.Vinculum)$, match:title ^(Vinculum quick)$
windowrule = size 380 560, match:class ^(ch\.giosuel\.Vinculum)$, match:title ^(Vinculum quick)$
windowrule = move (monitor_w-window_w-12) 52, match:class ^(ch\.giosuel\.Vinculum)$, match:title ^(Vinculum quick)$

# --- Window rules: Hyprland 0.48 – 0.52 (use INSTEAD of the block above) --
# windowrule = float, class:^(ch\.giosuel\.Vinculum)$, title:^(Vinculum)$
# windowrule = size 1040 680, class:^(ch\.giosuel\.Vinculum)$, title:^(Vinculum)$
# windowrule = center, class:^(ch\.giosuel\.Vinculum)$, title:^(Vinculum)$
# windowrule = float, class:^(ch\.giosuel\.Vinculum)$, title:^(Vinculum quick)$
# windowrule = pin, class:^(ch\.giosuel\.Vinculum)$, title:^(Vinculum quick)$
# windowrule = size 380 560, class:^(ch\.giosuel\.Vinculum)$, title:^(Vinculum quick)$
# windowrule = move 100%-w-12 52, class:^(ch\.giosuel\.Vinculum)$, title:^(Vinculum quick)$
# (Hyprland < 0.48: same lines, but `windowrulev2` instead of `windowrule`.)

# --- Start in the background ------------------------------------------------
# So NetworkManager can ask for the passwords kept in your keyring when it connects at login.
exec-once = vinculum --background

# --- Keybinds ----------------------------------------------------------------
bind = SUPER, N, exec, vinculum                     # open the window
bind = SUPER SHIFT, N, exec, vinculum --quick       # the quick popup
bind = , XF86WLAN, exec, vinculum --toggle-wifi     # the Wi-Fi key
