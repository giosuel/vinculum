# Continuous integration for every PR into main and every push to main.
#
# Only the aggregate "CI result" job needs to be required, so jobs can be added
# or renamed without touching the ruleset.

name: CI

on:
  # Every PR, also those stacked on another PR's branch.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: lint (fmt, clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Mock NetworkManager (python-dbusmock) and a real keyring (gnome-keyring)
        run: sudo apt-get install -y --no-install-recommends dbus python3-dbusmock gnome-keyring
      - name: test (including the mock NetworkManager tests)
        run: scripts/test.sh
        env:
          VINCULUM_REQUIRE_KEYRING: 1
      - name: --version
        run: cargo run --locked -p vinculum -- --version

  deps:
    name: deps (two-week rule)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Every crate version in Cargo.lock is at least 14 days old
        run: cargo xtask dep-age
      # The Flatpak builds offline from this list; its build only runs on packaging changes.
      - name: The Flatpak's crate list matches Cargo.lock
        run: python3 -I packaging/flatpak/check-cargo-sources.py

  metadata:
    name: metadata (desktop file, AppStream)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
      - name: desktop-file-validate
        run: desktop-file-validate packaging/linux/ch.giosuel.Vinculum.desktop
      - name: appstreamcli validate
        run: appstreamcli validate --no-net packaging/linux/ch.giosuel.Vinculum.metainfo.xml

  ci-result:
    name: CI result
    if: always()
    needs: [lint, test, deps, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed (skipped counts as passed)
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::At least one CI job failed or was cancelled."
            exit 1
          fi
