<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="t d">
  <title id="t">Lituus</title>
  <desc id="d">The Lituus logo, window tiles cut in a golden spiral with the spiral drawn through them, beside a Lituus window where a Wi-Fi network connects.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5cc8b0" stop-opacity=".32"/>
      <stop offset="1" stop-color="#5cc8b0" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: "Inter", "Cantarell", system-ui, -apple-system, "Segoe UI", sans-serif; }
      .float { transform-box: fill-box; transform-origin: center; animation: float 7s ease-in-out infinite; }
      @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
      .glow { transform-box: fill-box; transform-origin: center; animation: glow 3.5s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { opacity: .55; scale: .92; } 50% { opacity: 1; scale: 1.06; } }
      .tile { animation: tile 7s ease-in-out infinite; }
      @keyframes tile { 0%, 100% { filter: none; } 8% { filter: brightness(1.7); } 20% { filter: none; } }
      .draw { stroke-dasharray: 1 1; animation: draw 7s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1; } 45%, 100% { stroke-dashoffset: 0; } }
      /* The café row: available, then connecting, then connected, every 9 s. */
      .s0 { animation: s0 9s infinite; } @keyframes s0 { 0%, 22% { opacity: 1; } 26%, 96% { opacity: 0; } 100% { opacity: 1; } }
      .s1 { animation: s1 9s infinite; opacity: 0; } @keyframes s1 { 0%, 24% { opacity: 0; } 28%, 52% { opacity: 1; } 56%, 100% { opacity: 0; } }
      .s2 { animation: s2 9s infinite; opacity: 0; } @keyframes s2 { 0%, 54% { opacity: 0; } 58%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .sel { animation: sel 9s infinite; opacity: 0; } @keyframes sel { 0%, 12% { opacity: 0; } 16%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
      @keyframes spin { to { rotate: 360deg; } }
      .bar { animation: bar 9s infinite; } @keyframes bar { 0%, 54% { fill: #3a3f46; } 58%, 94% { fill: #5cc8b0; } 98%, 100% { fill: #3a3f46; } }
      .scan { animation: scan 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes scan { 0%, 100% { rotate: 0deg; } 50% { rotate: 180deg; } }
      @media (prefers-reduced-motion: reduce) {
        .float, .glow, .tile, .draw, .spin, .scan, .bar, .s0, .s1, .s2, .sel { animation: none; }
        .s0, .s1 { opacity: 0; } .s2, .sel { opacity: 1; } .bar { fill: #5cc8b0; }
      }
    </style>
  </defs>
  <g class="float">
    <circle class="glow" cx="178.8" cy="164.8" r="150" fill="url(#glow)"/>
    <g transform="translate(38 24) scale(2.2)">
      <rect x="4" y="4" width="120" height="120" rx="28" fill="#14171a" stroke="#262b30" stroke-width="1.2"/>
      <rect class="tile" style="animation-delay: 0.00s" x="12.50" y="33.13" width="61.75" height="61.75" rx="6.00" fill="#24312e"/>
      <rect class="tile" style="animation-delay: 0.45s" x="79.25" y="33.13" width="36.25" height="36.25" rx="6.00" fill="#29403a"/>
      <rect class="tile" style="animation-delay: 0.90s" x="95.00" y="74.38" width="20.50" height="20.50" rx="6.00" fill="#2f4f47"/>
      <rect class="tile" style="animation-delay: 1.35s" x="79.25" y="84.12" width="10.76" height="10.76" rx="3.94" fill="#376055"/>
      <rect class="tile" style="animation-delay: 1.80s" x="79.25" y="74.38" width="4.74" height="4.74" rx="2.43" fill="#417466"/>
      <rect class="tile" style="animation-delay: 2.25s" x="88.99" y="74.38" width="1.02" height="1.02" rx="1.50" fill="#4f9c89"/>
      <rect class="tile" style="animation-delay: 2.70s" x="91.28" y="80.40" width="-1.28" height="-1.28" rx="0.93" fill="#5cc8b0"/>
      <path class="draw" pathLength="1" d="M 10.00 97.37 A 66.75 66.75 0 0 1 76.75 30.63 A 41.25 41.25 0 0 1 118.00 71.88 A 25.50 25.50 0 0 1 92.50 97.37 A 15.76 15.76 0 0 1 76.75 81.62 A 9.74 9.74 0 0 1 86.49 71.88 A 6.02 6.02 0 0 1 92.50 77.90 A 3.72 3.72 0 0 1 88.78 81.62" fill="none" stroke="#e9efe9" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g filter="url(#shadow)"><rect x="372" y="24" width="428" height="284" rx="16" fill="#17191c" stroke="#2a2e33" stroke-width="1.5"/></g>
  <text x="396" y="64" font-size="19" font-weight="700" fill="#e8eaed">Wi-Fi</text>
  <g transform="translate(696 46)"><rect width="30" height="30" rx="8" fill="none" stroke="#353a40"/><g class="scan"><path d="M21 15a6 6 0 1 1-1.8-4.2M21 8.5v3h-3" fill="none" stroke="#c9ced4" stroke-width="1.6" stroke-linecap="round"/></g></g>
  <rect x="738" y="50" width="40" height="22" rx="11" fill="#5cc8b0"/><circle cx="767" cy="61" r="8" fill="#0c1513"/>
  <text x="396" y="104" font-size="11" font-weight="700" letter-spacing=".8" fill="#8b929a">CONNECTED</text>
  <rect x="386" y="114" width="400" height="50" rx="9" fill="#1f2a27" stroke="#2c4a42"/>
  <rect x="400.0" y="143.0" width="3.2" height="4.0" rx="1" fill="#5cc8b0"/><rect x="405.0" y="139.5" width="3.2" height="7.5" rx="1" fill="#5cc8b0"/><rect x="410.0" y="136.0" width="3.2" height="11.0" rx="1" fill="#5cc8b0"/><rect x="415.0" y="132.5" width="3.2" height="14.5" rx="1" fill="#5cc8b0"/>
  <text x="436" y="136" font-size="15" font-weight="600" fill="#e8eaed">Lumen Home</text>
  <text x="436" y="154" font-size="12.5" fill="#5cc8b0">Connected · WPA2/WPA3 · 5 GHz</text>
  <path d="M760 137h9v7h-9zM762 137v-2a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="#8b929a" stroke-width="1.3"/>
  <text x="396" y="188" font-size="11" font-weight="700" letter-spacing=".8" fill="#8b929a">AVAILABLE</text>
  <rect class="sel" x="386" y="198" width="400" height="50" rx="9" fill="#1f2a27" stroke="#2c4a42"/>
  <rect x="400.0" y="227.0" width="3.2" height="4.0" rx="1" fill="#5cc8b0"/><rect x="405.0" y="223.5" width="3.2" height="7.5" rx="1" fill="#5cc8b0"/><rect x="410.0" y="220.0" width="3.2" height="11.0" rx="1" fill="#5cc8b0"/><rect class="bar" x="415.0" y="216.5" width="3.2" height="14.5" rx="1" fill="#3a3f46"/>
  <text x="436" y="220" font-size="15" font-weight="600" fill="#e8eaed">Aster Café</text>
  <text class="s0" x="436" y="238" font-size="12.5" fill="#a0a7af">WPA2 · 2.4 / 5 GHz</text>
  <g class="s1"><text x="452" y="238" font-size="12.5" fill="#5cc8b0">Connecting…</text><circle class="spin" cx="442" cy="234" r="5" fill="none" stroke="#5cc8b0" stroke-width="1.8" stroke-dasharray="20 12"/></g>
  <text class="s2" x="436" y="238" font-size="12.5" fill="#5cc8b0">Connected · password in your keyring</text>
  <path d="M760 221h9v7h-9zM762 221v-2a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="#8b929a" stroke-width="1.3"/>
  <rect x="386" y="254" width="400" height="50" rx="9" fill="none"/>
  <rect x="400.0" y="283.0" width="3.2" height="4.0" rx="1" fill="#5cc8b0"/><rect x="405.0" y="279.5" width="3.2" height="7.5" rx="1" fill="#5cc8b0"/><rect x="410.0" y="276.0" width="3.2" height="11.0" rx="1" fill="#3a3f46"/><rect x="415.0" y="272.5" width="3.2" height="14.5" rx="1" fill="#3a3f46"/>
  <text x="436" y="276" font-size="15" font-weight="600" fill="#e8eaed">Bibliothek-Free</text>
  <text x="436" y="294" font-size="12.5" fill="#a0a7af">Open · 5 GHz</text>
</svg>
