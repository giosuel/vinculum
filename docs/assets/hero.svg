    <circle r="6.5" fill="#f2fffb"><animateMotion dur="7.5s" repeatCount="indefinite" path="M94.0 116.0 L179.2 165.2 L264.4 214.4 L264.4 116.0 L179.2 165.2 L179.2 263.6 L94.0 214.4 L94.0 116.0"/></circle>
    <circle r="14" fill="#5cc8b0" opacity=".3"><animateMotion dur="5s" repeatCount="indefinite" path="M179.2 66.8 L94.0 116.0 L179.2 165.2 L264.4 116.0 L179.2 66.8"/></circle>
    <circle r="6.5" fill="#f2fffb"><animateMotion dur="5s" repeatCount="indefinite" path="M179.2 66.8 L94.0 116.0 L179.2 165.2 L264.4 116.0 L179.2 66.8"/></circle>
